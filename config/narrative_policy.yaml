version: narrative-policy-v1
max_core_messages: 3
positioning_message_importance: 10.0

default_section_order:
  - summary
  - skills
  - experience
  - projects
  - education
  - languages
  - links

requirement_importance_weights:
  mandatory: 3.0
  preferred: 2.0
  unknown: 1.0

support_level_weights:
  EXACT_VERIFIED: 3.0
  APPROVED_ALIAS: 2.5
  TAXONOMY_RELATED: 1.0
  UNKNOWN: 0.0

priority_requirement_bonus: 1.0

max_off_strategy_claim_ratio: 0.35
max_competing_identity_signals: 1
min_scanability_score: 0.67
max_scan_claims: 8

generic_language_phrases:
  en:
    - results-driven
    - passionate
    - hard-working
    - team player
    - fast learner
    - proactive
    - detail-oriented
  es:
    - orientado a resultados
    - apasionado
    - trabajador
    - trabajo en equipo
    - aprendizaje rápido
    - proactivo
    - detallista
