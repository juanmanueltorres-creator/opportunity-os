design:
  theme: sb2nov
  page:
    size: a4
    top_margin: 0.52in
    bottom_margin: 0.52in
    left_margin: 0.58in
    right_margin: 0.58in
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.62em
    alignment: left
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 21pt
      headline: 10.6pt
      connections: 9.5pt
      section_titles: 1.12em
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    space_below_name: 0.20cm
    space_below_headline: 0.16cm
    space_below_connections: 0.32cm
    connections:
      show_icons: false
  section_titles:
    type: with_full_line
    line_thickness: 0.4pt
    space_above: 0.30cm
    space_below: 0.16cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.52em
    space_between_text_based_entries: 0.25em
    show_time_spans_in: []
