name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Compile application
        run: python -m compileall app

      - name: Check feature diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Check private files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files -- \
            '.env' \
            'profile.local.yaml' \
            'sources.local.yaml' \
            'profile/master_facts.local.yaml' \
            'profile/evidence_catalog.local.yaml' \
            'profile/*.local.yaml' \
            '*.local.yaml' \
            'state/outreach.local.sqlite3' \
            'state/relationships.local.sqlite3*' \
            'artifacts/relationships/**' \
            'artifacts/applications/**' \
            'artifacts/applications/**/outreach/**' \
            '*.pdf' \
            '*.docx')"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden private/generated files are tracked:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Render recruiter visual previews
        run: python scripts/render_recruiter_previews.py

      - name: Upload recruiter visual previews
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-previews
          path: artifacts/ci/recruiter-preview/*.pdf
          if-no-files-found: error
          retention-days: 7
