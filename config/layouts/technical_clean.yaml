design:
  theme: sb2nov
  page:
    size: a4
    top_margin: 0.48in
    bottom_margin: 0.48in
    left_margin: 0.55in
    right_margin: 0.55in
    show_page_numbering: false
    show_footer: false
  section_titles:
    type: with_full_line
    font_weight: 600
    line_thickness: 0.5pt
    space_above: 0.34cm
    space_below: 0.18cm
  links:
    underline: false
    use_external_link_icon: false
    show_external_link_icon: false
  header:
    alignment: left
    photo_position: none
    connections:
      show_icons: false
      space_between_connections: 0.22cm
      separator: " | "
      use_urls_as_placeholders: false
      make_connections_links: true
  typography:
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 22pt
      headline: 11pt
      connections: 9.6pt
      section_titles: 1.18em
    bold:
      name: 700
      headline: 600
      section_titles: 600
    line_spacing: 0.64em
    alignment: left
    date_and_location_column_alignment: right
  sections:
    space_between_regular_entries: 0.48em
    space_between_text_based_entries: 0.26em
    show_time_spans_in: []
  entries:
    short_second_row: true
    degree_width: 1cm
    date_and_location_width: 3.8cm
    allow_page_break: false
    allow_page_break_even_if_first: false
settings:
  show_top_note: false
