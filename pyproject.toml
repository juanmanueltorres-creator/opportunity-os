[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-os"
version = "0.2.0c1"
description = "Open-source opportunity discovery, matching and application preparation with explainable scoring and human approval."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic>=2",
  "PyYAML",
  "reportlab>=4.2",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pypdf>=5", "pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
